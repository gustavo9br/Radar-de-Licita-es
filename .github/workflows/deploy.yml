name: Build & Publish Images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/radar-licitacoes-${{ matrix.service }}:latest
          # Só usado pelo build do frontend (VITE_APP_TOKEN fica embutido no bundle
          # estático); o backend ignora esse build-arg. Front e back ficam no mesmo
          # domínio em produção (Traefik roteia /api pro backend), então não precisa
          # de VITE_API_URL — a imagem do frontend funciona em qualquer domínio.
          build-args: |
            VITE_APP_TOKEN=${{ secrets.APP_TOKEN }}
