server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Só é usado quando o frontend roda sem o Traefik na frente (ex: docker-compose.dev.yml),
    # já que em produção o Traefik intercepta /api antes de chegar aqui (docker-compose.prod.yml).
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
